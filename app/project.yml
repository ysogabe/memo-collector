# XcodeGen の定義。`xcodegen generate` で ContextCapture.xcodeproj を作る（xcodeproj は生成物・git 管理外）。
name: ContextCapture
options:
  bundleIdPrefix: dev.ysogabe
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
packages:
  ContextCaptureKit:
    path: ../Packages/ContextCaptureKit
targets:
  ContextCapture:
    type: application
    platform: macOS
    sources:
      - path: ContextCapture
        excludes:
          - "Resources/Info.plist"
    dependencies:
      # Wave 0 は CCCore だけをリンクする。他のモジュールは配線（Wave 2 以降）で足す。
      - package: ContextCaptureKit
        product: CCCore
    settings:
      base:
        PRODUCT_NAME: ContextCapture
        PRODUCT_BUNDLE_IDENTIFIER: dev.ysogabe.ContextCapture
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ContextCapture/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ContextCapture/ContextCapture.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"   # Sign to Run Locally
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        # ローカル署名（ad-hoc）では Xcode が --options runtime を付けないため明示する
        # （製品と同じくマイク等の entitlement が強制される状態で開発する）。
        OTHER_CODE_SIGN_FLAGS: "--options=runtime"
        # Hardened Runtime のライブラリ検証は ad-hoc 署名の dylib を別 Team とみなして拒否するため、
        # Debug の ContextCapture.debug.dylib（SwiftUI プレビュー用）を作らない。埋め込み dylib を足すときも同じ制約がある。
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  ContextCapture:
    build:
      targets:
        ContextCapture: all
    run:
      config: Debug
    archive:
      config: Release
